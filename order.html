<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Your Order - Brew & Bite Café</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="order-section">

        <h1>Place Your Order ☕</h1>

    
        
    <form action="https://formspree.io/f/xzdnnvzv" method="POST">

    <input type="hidden" name="_subject" value="New Brew & Bite Café Order">

    <label>Full Name</label><br>
    <input type="text" name="Full Name" placeholder="Enter your name" required><br><br>

    <label>Phone Number</label><br>
    <input type="tel" name="Phone Number" placeholder="Enter your phone number" required><br><br>

    <label>Address</label><br>
    <textarea name="Address" placeholder="Enter your address" required></textarea><br><br>

    <label>Product</label><br>
    <input type="text" id="product" name="Product" readonly><br><br>

    <label>Quantity</label><br>
    <input type="number" id="quantity" name="Quantity" value="1" min="1" required><br><br>

    <label>Total Price</label><br>
    <input type="text" id="totalPrice" name="Total Price" readonly><br><br>

    <button type="submit">Place Order</button>

    </form>

    </section>
<script>
    document.getElementById("product").value =
        localStorage.getItem("productName");

    document.getElementById("totalPrice").value =
        "Rs. " + localStorage.getItem("productPrice");
</script>
    <script src="script.js"></script>

</body>
</html>
